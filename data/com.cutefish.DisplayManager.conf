<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="com.cutefish.DisplayManager"/>
  </policy>
  <!-- The daemon checks that the caller owns the session it is asked to end,
       and keeps each caller's background under the caller's own name. -->
  <policy context="default">
    <allow send_destination="com.cutefish.DisplayManager"
           send_interface="com.cutefish.DisplayManager"/>
    <allow send_destination="com.cutefish.DisplayManager"
           send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
</busconfig>
